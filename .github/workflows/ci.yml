name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The live Netlify build runs Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, as published in the release's checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the whole history
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          (cd "$RUNNER_TEMP" && echo "${GITLEAKS_SHA256}  $f" | sha256sum -c - && tar -xzf "$f" gitleaks)
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="--all" .

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.164.0
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/secrets --config p/owasp-top-ten --config p/javascript --metrics=off --error
